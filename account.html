<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account -- BlackVinyl</title>
<meta name="description" content="View and update your BlackVinyl account details.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="navbar-root"></div>
<main class="container">
  <section class="section">
    <div class="page-header">
      <h1 class="page-title">My Account</h1>
      <p class="page-subtitle">Manage your profile details.</p>
    </div>

    <div class="panel panel-narrow">
      <div class="form-group">
        <label>Email</label>
        <div class="field-static" id="account-email"></div>
      </div>

      <div id="account-view">
        <div class="form-group">
          <label>First Name</label>
          <div class="field-static" id="account-first-name"></div>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <div class="field-static" id="account-last-name"></div>
        </div>
        <button type="button" class="btn btn-outline" id="account-edit-btn">Edit</button>
      </div>

      <form id="account-form" novalidate hidden>
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
        </div>
        <div class="form-error" id="account-error"></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-outline" id="account-cancel-btn">Cancel</button>
        </div>
      </form>

      <div style="height:1px;background:var(--border);margin:22px 0 18px;"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a href="orders.html" class="btn btn-outline btn-sm">Purchase History</a>
        <a href="liked.html" class="btn btn-outline btn-sm">Liked Albums</a>
      </div>
    </div>
  </section>
</main>
<div id="footer-root"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/account.js"></script>
</body>
</html>
