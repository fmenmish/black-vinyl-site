<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account -- BlackVinyl</title>
<meta name="description" content="Create a BlackVinyl account to start collecting.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="navbar-root"></div>
<main class="container">
  <div class="section">
    <div class="page-header">
      <h1 class="page-title">Create Account</h1>
      <p class="page-subtitle">Create a new BlackVinyl account to start collecting.</p>
    </div>

    <div class="auth-wrap">
      <form id="form-signup" novalidate>
        <div class="form-error" id="signup-error"></div>
        <div class="form-row">
          <div class="form-group">
            <label for="signup-first-name">First Name</label>
            <input type="text" id="signup-first-name" name="firstName" autocomplete="given-name" required>
            <div class="field-static visually-hidden" id="signup-first-name-static"></div>
          </div>
          <div class="form-group">
            <label for="signup-last-name">Last Name</label>
            <input type="text" id="signup-last-name" name="lastName" autocomplete="family-name" required>
            <div class="field-static visually-hidden" id="signup-last-name-static"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" autocomplete="email" required>
          <div class="field-static visually-hidden" id="signup-email-static"></div>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p style="text-align:center; margin-top:18px; font-size:14px; color:var(--text-muted);">
        Already have an account? <a href="login.html" id="login-link" class="link-btn">Log in</a>
      </p>
    </div>
  </div>
</main>
<div id="footer-root"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/signup.js"></script>
<script src="https://cdn.c360a.salesforce.com/beacon/c360a/7de6a3b1-0e6a-4644-84d8-524a1e90d727/scripts/c360a.min.js"></script>
</body>
</html>
