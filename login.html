<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In -- BlackVinyl</title>
<meta name="description" content="Log in to your BlackVinyl account.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="navbar-root"></div>
<main class="container">
  <div class="section">
    <div class="page-header">
      <h1 class="page-title">Log In</h1>
      <p class="page-subtitle">Sign in to your BlackVinyl account.</p>
    </div>

    <div class="auth-wrap">
      <form id="form-login" novalidate>
        <div class="form-error" id="login-error"></div>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="email" required>
          <div class="field-static visually-hidden" id="login-email-static"></div>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>
      <p style="text-align:center; margin-top:18px; font-size:14px; color:var(--text-muted);">
        Don't have an account? <a href="signup.html" id="signup-link" class="link-btn">Create one</a>
      </p>
    </div>
  </div>
</main>
<div id="footer-root"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/login.js"></script>
<script src="https://cdn.c360a.salesforce.com/beacon/c360a/7de6a3b1-0e6a-4644-84d8-524a1e90d727/scripts/c360a.min.js"></script>
</body>
</html>
