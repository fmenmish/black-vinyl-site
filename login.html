<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In / Create Account -- BlackVinyl</title>
<meta name="description" content="Log in to your BlackVinyl account or create a new one.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
<style>
  .auth-form { display: none; }
  .auth-form.active { display: block; }
</style>
</head>
<body>
<div id="navbar-root"></div>
<main class="container">
  <div class="section">
    <div class="page-header">
      <h1 class="page-title">Log In / Create Account</h1>
      <p class="page-subtitle">Sign in to your BlackVinyl account, or create a new one to start collecting.</p>
    </div>

    <div class="auth-wrap">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" data-target="form-login">Log In</div>
        <div class="auth-tab" id="tab-signup" data-target="form-signup">Create Account</div>
      </div>

      <form id="form-login" class="auth-form active" novalidate>
        <div class="form-error" id="login-error"></div>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <form id="form-signup" class="auth-form" novalidate>
        <div class="form-error" id="signup-error"></div>
        <div class="form-row">
          <div class="form-group">
            <label for="signup-first-name">First Name</label>
            <input type="text" id="signup-first-name" name="firstName" autocomplete="given-name" required>
          </div>
          <div class="form-group">
            <label for="signup-last-name">Last Name</label>
            <input type="text" id="signup-last-name" name="lastName" autocomplete="family-name" required>
          </div>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
    </div>
  </div>
</main>
<div id="footer-root"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
